name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate
      - name: Upload verified unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: audioshield-unpacked-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
