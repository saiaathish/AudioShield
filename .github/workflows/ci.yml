name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upgrade vulnerable dev toolchain for verification
        run: npm install --save-dev esbuild@^0.28.2 vitest@^4.1.10
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Capture npm audit
        shell: bash
        run: npm audit --json > npm-audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-upgrade
          path: |
            package.json
            package-lock.json
            npm-audit.json
          if-no-files-found: error
